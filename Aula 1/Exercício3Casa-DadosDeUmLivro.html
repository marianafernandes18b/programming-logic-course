<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados do Livro</title>
</head>
<body>
    <script>
        Título = "A Paciente Silenciosa"
        Autor = "Alex Michaelides"
        Data   = "20 de Maio de 2019" 
        Sinopse = "A Paciente Silenciosa é um thriller psicológico que conta a história de Alicia Berenson, uma mulher que aparentemente leva uma vida perfeita até o dia em que comete um assassinato brutal e se recusa a falar uma palavra desde então. O livro explora temas de trauma, amor e obsessão, mantendo os leitores em suspense até a última página."
        Preço = 39.90
        Disponível = true
        Páginas = "364"
        Editora = "HarperCollins"
        Formato = "Capa comum"
        Idioma = "Português"
        Tradutor = "Ana Rodrigues"
        Quantidade = "39"
        
        console.log("Título: "+Título)
        console.log("Autor: "+Autor)
        console.log("Data de Publicação: "+Data)
        console.log("Preço: R$ "+Preço.toFixed(2).replace('.', ','))
        console.log("Disponível: "+(Disponível ? "Sim" : "Não"))
        console.log("Páginas: "+Páginas)
        console.log("Editora: "+Editora)
        console.log("Formato: "+Formato)
        console.log("Idioma: "+Idioma)
        console.log("Tradutor: "+Tradutor)
        console.log("Quantidade: "+Quantidade)
        console.log("Sinopse: "+Sinopse)
        
        document.write("Título: "+Título+"<br>")
        document.write("Autor: "+Autor+"<br>")
        document.write ("Data de Publicação: "+Data+"<br>")
        document.write("Preço: R$ "+Preço.toFixed(2).replace('.', ',')+"<br>")
        document.write("Disponível: "+(Disponível ? "Sim" : "Não")+"<br>")
        document.write("Páginas: "+Páginas+"<br>")
        document.write("Editora: "+Editora+"<br>")
        document.write("Formato: "+Formato+"<br>")
        document.write("Idioma: "+Idioma+"<br>")
        document.write("Tradutor: "+Tradutor+"<br>")
        document.write("Quantidade: "+Quantidade+"<br>")
        document.write("Sinopse: "+Sinopse+"<br>")
    </script>
