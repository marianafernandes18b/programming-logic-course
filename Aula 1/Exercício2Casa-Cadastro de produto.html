    <!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
</head>
<body>
<script>
    let produto = "Notebook Dell G15"
    let categoria = "Eletrônicos-Informática"
    let marca = "Dell"
    let preco = 8500.00
    let quantidade = 25
    let disponivel = true 
    let descricao = "Notebook Gamer Dell G15, Intel Core i7 13ª Geração, 16GB, Nvidia RTX 4050, SSD 1TB, Tela 15.6"
    let codigo = "NBG15-2024"

    document.write("Produto: "+produto+"<br>")
    document.write("Categoria: "+categoria+"<br>")   
    document.write("Marca: "+marca+"<br>")
    document.write("Preço: R$"+preco+"<br>")
    document.write("Quantidade: "+quantidade+"<br>")
    document.write("Disponível: "+disponivel+"<br>")
    document.write("Descrição: "+descricao+"<br>")
    document.write("Código: "+codigo+"<br>")
</script>
</body>
</html>
