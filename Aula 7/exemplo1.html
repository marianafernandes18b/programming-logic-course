<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folha de Pagamento</title>
</head>
<body>

<h1>Folha de pagamento</h1>

<form>

    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required><br><br>
    <label for="salariBase">Salário:</label>
    <input type="number" id="salarioBase" name="salario" step="0.01" required><br><br>
    <button type="button" onclick="calcularSalario()">Calcular</button>
    <button type="button" onclick="limparCampos()">Limpar</button>

</form>
<div id="resultado"></div>
    <script src="script.js"></script>
</body>
</html>
