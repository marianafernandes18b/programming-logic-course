<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcule o seu dobro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        input[readonly] {
            background-color: #e9ecef;
        }
        .checkbox-grupo {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #444;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            padding: 10px;
            background-color: #e2f0d9;
            color: #385723;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Calcule o seu dobro</h1>
        
        <div class="campo">
            <label for="numero">Número:</label>
            <input type="number" id="numero" name="numero">
        </div>

        <div class="campo">
            <label for="dobro">Dobro:</label>
            <input type="number" id="dobro" name="dobro" readonly>
        </div>

        <div class="checkbox-grupo">
            <div class="checkbox-item">
                <input type="checkbox" id="positivo" disabled>
                <label for="positivo">Positivo</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="negativo" disabled>
                <label for="negativo">Negativo</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="zero" disabled>
                <label for="zero">Zero</label>
            </div>
        </div>

        <!-- Botão para disparar a função do JavaScript -->
        <button onclick="calcular()">Iniciar Programa</button>

        <!-- Onde vai aparecer o resultado em texto -->
        <div id="resultado">O resultado aparecerá aqui...</div>
    </div>

    <script src="Exercicio.js"></script>
</body>
</html>
