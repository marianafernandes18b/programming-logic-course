<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div class="container">
        <h2>Calculadora Simples</h2>
        
        <div class="campo">
            <label for="num1">Primeiro Número:</label>
            <input type="number" id="num1" placeholder="Digite o 1º número" step="any">
        </div>

        <div class="campo">
            <label for="num2">Segundo Número:</label>
            <input type="number" id="num2" placeholder="Digite o 2º número" step="any">
        </div>

        <div class="campo">
            <label for="operacao">Escolha a Operação:</label>
            <select id="operacao">
                <option value="1">1 – Soma</option>
                <option value="2">2 – Subtração</option>
                <option value="3">3 – Multiplicação</option>
                <option value="4">4 – Divisão</option>
            </select>
        </div>

        <button onclick="calcular()">Calcular</button>

        <div id="resultado"></div>
    </div>

    <script src="calculadora.js"></script>
</body>
</html>
