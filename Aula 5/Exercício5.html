<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Análise de Financiamento</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ff0000;
      border-radius: 8px;
      background-color: #f9f9f9;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .campo { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #aaa; border-radius: 4px; }
    button { 
      width: 100%; 
      padding: 10px; 
      background-color: #22ff00b6; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-size: 16px; 
      cursor: pointer; 
      margin-top: 10px;
    }
    button:hover { background-color: #218838; }
    #resultado { 
      margin-top: 20px; 
      padding: 15px; 
      border-radius: 4px; 
      display: none; /* Fica escondido até o usuário clicar no botão */
    }
    .aprovado { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .negado { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <h2>Análise de Financiamento</h2>

  <div class="campo">
    <label for="nome">Nome do cliente:</label>
    <input type="text" id="nome" placeholder="Ex: João da Silva">
  </div>

  <div class="campo">
    <label for="salario">Salário (R$):</label>
    <input type="number" id="salario" placeholder="Ex: 3000">
  </div>

  <div class="campo">
    <label for="parcela">Valor da parcela (R$):</label>
    <input type="number" id="parcela" placeholder="Ex: 800">
  </div>

  <div class="campo">
    <label for="numParcelas">Número de parcelas:</label>
    <input type="number" id="numParcelas" placeholder="Ex: 48">
  </div>

  <!-- Quando clicar aqui, vai chamar a função analisarFinanciamento() do JS -->
  <button onclick="analisarFinanciamento()">Analisar Solicitação</button>

  <!-- O resultado vai aparecer dentro desta div -->
  <div id="resultado"></div>

  <!-- Conectando o seu arquivo JS -->
  <script src="Exercício5.js"></script>
</body>
</html>
