<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Menu de Opções</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .campo { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    #resultado { margin-top: 20px; font-weight: bold; padding: 10px; background-color: #f0f0f0; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>Menu de Opções</h2>

  <div class="campo">
    <label for="opcao">Escolha uma opção:</label>
    <select id="opcao" onchange="mudarOpcao()">
      <option value="">-- Selecione --</option>
      <option value="1">1 – Par ou Ímpar</option>
      <option value="2">2 – Comparar dois valores</option>
      <option value="3">3 – Calcular o dobro</option>
    </select>
  </div>

  <div id="entradas"></div>

  <button onclick="executar()">Executar</button>

  <div id="resultado"></div>

  <!-- Aqui é onde a mágica acontece: conectamos o arquivo JS -->
  <script src="script.js"></script>
</body>
</html>
