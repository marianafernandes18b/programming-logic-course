<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de Notas</title>
    <style>
        /* Define a fonte, o fundo da página e centraliza o conteúdo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            max-width: 600px;
            margin: 40px auto; /* Centraliza a página e dá uma margem no topo */
            padding: 20px;
        }

        /* Estilo do título principal */
        h1 {
            text-align: center;
            color: #1a365d;
            font-size: 28px;
            margin-bottom: 30px;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 10px;
        }

        /* Transforma os parágrafos gerados pelo JS em "cartões" */
        p {
            background-color: #ffffff;
            padding: 18px 24px;
            border-radius: 8px; /* Bordas arredondadas */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); /* Sombra suave */
            margin-bottom: 15px;
            font-size: 16px;
            line-height: 1.5;
            border-left: 6px solid #3b82f6; /* Detalhe azul na lateral */
            transition: transform 0.2s; /* Animação suave */
        }

        /* Efeito de hover para os parágrafos */
        p:hover {
            transform: scale(1.02);
        }

        /* Estilo para o texto em negrito dentro dos parágrafos */
        strong {
            color: #1e293b;
            background-color: #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>


    <script src="exercício7.js"></script>

</body>
</html>
